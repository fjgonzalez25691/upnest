AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UpNest Lambda Functions - Baby CRUD API (Hackathon - Simplified)

# Global configuration for all Lambda functions
Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    Environment:
      Variables:
        # DynamoDB Table Names
        USERS_TABLE: UpNest-Users-dev
        BABIES_TABLE: UpNest-Babies-dev
        GROWTH_DATA_TABLE: UpNest-GrowthData-dev
        VACCINATIONS_TABLE: UpNest-Vaccinations-dev
        MILESTONES_TABLE: UpNest-Milestones-dev
        
        # Cognito Configuration
        COGNITO_USER_POOL_ID: eu-south-2_WInbcDDjo
        COGNITO_CLIENT_ID: 75g0r5a7bbp1mgpmqrg3e1iibm
        COGNITO_REGION: eu-south-2
        
        # Application Configuration
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: hackathon
    Description: Deployment environment

Resources:
  # Baby Management Functions (Essential)
  CreateBabyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-create-baby-hackathon
      CodeUri: babies/
      Handler: babies_create.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-Babies-dev
      Events:
        CreateBaby:
          Type: Api
          Properties:
            Path: /babies
            Method: post
            
  ListBabiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-list-babies-hackathon
      CodeUri: babies/
      Handler: babies_list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        ListBabies:
          Type: Api
          Properties:
            Path: /babies
            Method: get

  GetBabyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-get-baby-hackathon
      CodeUri: babies/
      Handler: babies_get.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        GetBaby:
          Type: Api
          Properties:
            Path: /babies/{babyId}
            Method: get

Outputs:
  APIGatewayEndpoint:
    Description: "API Gateway endpoint URL for Hackathon stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: UpNest-API-Hackathon-Endpoint
