AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UpNest Lambda Functions - Baby CRUD API (Hackathon - Simplified)

# Global configuration for all Lambda functions
Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    Environment:
      Variables:
        # DynamoDB Table Names
        USERS_TABLE: UpNest-Users-dev
        BABIES_TABLE: UpNest-Babies-dev
        GROWTH_DATA_TABLE: UpNest-GrowthData-dev
        VACCINATIONS_TABLE: UpNest-Vaccinations-dev
        MILESTONES_TABLE: UpNest-Milestones-dev
        
        # Cognito Configuration
        COGNITO_USER_POOL_ID: eu-south-2_WInbcDDjo
        COGNITO_CLIENT_ID: 75g0r5a7bbp1mgpmqrg3e1iibm
        COGNITO_REGION: eu-south-2
        
        # Application Configuration
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: hackathon
    Description: Deployment environment

Resources:
  # Baby Service - UNIFIED HANDLER (replaces 5 functions)
  BabyServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-baby-service-hackathon
      CodeUri: babies/
      Handler: baby_service.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-Babies-dev
      Events:
        BabiesRoot:
          Type: Api
          Properties:
            Path: /babies
            Method: ANY
        BabiesId:
          Type: Api
          Properties:
            Path: /babies/{babyId}
            Method: ANY

  # Growth Data Service - UNIFIED HANDLER (replaces 6 functions)
  GrowthDataServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-growth-data-service-hackathon
      CodeUri: growth-data/
      Handler: growth_data_service.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        GrowthDataRoot:
          Type: Api
          Properties:
            Path: /growth-data
            Method: ANY
        GrowthDataId:
          Type: Api
          Properties:
            Path: /growth-data/{dataId}
            Method: ANY
        BabyGrowthData:
          Type: Api
          Properties:
            Path: /babies/{babyId}/growth
            Method: GET

  # Percentiles Service - UNIFIED HANDLER for growth percentile calculations
  PercentilesServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-percentiles-service-hackathon
      CodeUri: percentiles/
      Handler: percentiles_service.lambda_handler
      Timeout: 60  # Longer timeout for data processing
      MemorySize: 512  # More memory for pandas/scipy operations
      Events:
        PercentilesCalculate:
          Type: Api
          Properties:
            Path: /percentiles/calculate
            Method: POST

Outputs:
  APIGatewayEndpoint:
    Description: "API Gateway endpoint URL for Hackathon stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: UpNest-API-Hackathon-Endpoint
