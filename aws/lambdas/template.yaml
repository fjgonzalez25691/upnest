AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  UpNest Lambda Functions - Baby CRUD API and Percentile Calculations

# Global configuration for all Lambda functions
Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    Environment:
      Variables:
        # DynamoDB Table Names (direct values for hackathon)
        USERS_TABLE: UpNest-Users-dev
        BABIES_TABLE: UpNest-Babies-dev
        GROWTH_DATA_TABLE: UpNest-GrowthData-dev
        VACCINATIONS_TABLE: UpNest-Vaccinations-dev
        MILESTONES_TABLE: UpNest-Milestones-dev
        
        # Cognito Configuration
        COGNITO_USER_POOL_ID: eu-south-2_WInbcDDjo
        COGNITO_CLIENT_ID: 75g0r5a7bbp1mgpmqrg3e1iibm
        COGNITO_REGION: eu-south-2
        
        # Application Configuration
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Deployment environment

Resources:
  # Baby Management Functions
  CreateBabyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-create-baby-hackathon
      CodeUri: babies/
      Handler: babies_create.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-Babies-dev
      Events:
        CreateBaby:
          Type: Api
          Properties:
            Path: /babies
            Method: post
            
  GetBabyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: upnest-get-baby-hackathon
      CodeUri: babies/
      Handler: babies_get.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        GetBaby:
          Type: Api
          Properties:
            Path: /babies/{babyId}
            Method: get
            
  ListBabiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-list-babies-${Environment}
      CodeUri: babies/
      Handler: babies_list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        ListBabies:
          Type: Api
          Properties:
            Path: /babies
            Method: get

  UpdateBabyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-update-baby-${Environment}
      CodeUri: babies/
      Handler: babies_update.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-Babies-dev
      Events:
        UpdateBaby:
          Type: Api
          Properties:
            Path: /babies/{babyId}
            Method: put
            
  DeleteBabyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-delete-baby-${Environment}
      CodeUri: babies/
      Handler: babies_delete.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-Babies-dev
      Events:
        DeleteBaby:
          Type: Api
          Properties:
            Path: /babies/{babyId}
            Method: delete

  # Growth Data Management Functions
  CreateGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-create-growth-data-${Environment}
      CodeUri: growth-data/
      Handler: growth-data-create.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        CreateGrowthData:
          Type: Api
          Properties:
            Path: /growth-data
            Method: post
            
  GetGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-get-growth-data-${Environment}
      CodeUri: growth-data/
      Handler: growth-data-get.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        GetGrowthData:
          Type: Api
          Properties:
            Path: /growth-data/{recordId}
            Method: get
            
  GetSingleGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-get-single-growth-data-${Environment}
      CodeUri: growth-data/
      Handler: growth-data-get-single.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        GetSingleGrowthData:
          Type: Api
          Properties:
            Path: /babies/{babyId}/growth-data/{recordId}
            Method: get
            
  ListGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-list-growth-data-${Environment}
      CodeUri: growth-data/
      Handler: growth-data-list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        ListGrowthData:
          Type: Api
          Properties:
            Path: /babies/{babyId}/growth-data
            Method: get
            
  UpdateGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-update-growth-data-${Environment}
      CodeUri: growth-data/
      Handler: growth-data-update.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        UpdateGrowthData:
          Type: Api
          Properties:
            Path: /growth-data/{recordId}
            Method: put
            
  DeleteGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-delete-growth-data-${Environment}
      CodeUri: growth-data/
      Handler: growth-data-delete.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        DeleteGrowthData:
          Type: Api
          Properties:
            Path: /growth-data/{recordId}
            Method: delete

  # Percentile Calculation Function
  CalculatePercentilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-calculate-percentiles-${Environment}
      CodeUri: percentiles/
      Handler: percentiles_calculate.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-GrowthData-dev

  # Advanced Features Functions  
  GetCurrentPercentilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-get-current-percentiles-${Environment}
      CodeUri: advanced/
      Handler: get_percentiles.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-GrowthData-dev
      Events:
        GetCurrentPercentiles:
          Type: Api
          Properties:
            Path: /babies/{babyId}/percentiles
            Method: get

  GetGrowthChartDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-get-growth-chart-data-${Environment}
      CodeUri: advanced/
      Handler: get_growth_chart.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-GrowthData-dev
      Events:
        GetGrowthChartData:
          Type: Api
          Properties:
            Path: /babies/{babyId}/growth-chart
            Method: get

  BulkImportGrowthDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub upnest-bulk-import-growth-data-${Environment}
      CodeUri: advanced/
      Handler: bulk_import.lambda_handler
      Timeout: 60  # Longer timeout for bulk operations
      MemorySize: 512  # More memory for batch processing
      Policies:
        - DynamoDBCrudPolicy:
            TableName: UpNest-GrowthData-dev
        - DynamoDBReadPolicy:
            TableName: UpNest-Babies-dev
      Events:
        BulkImportGrowthData:
          Type: Api
          Properties:
            Path: /babies/{babyId}/growth/bulk
            Method: post

Outputs:
  BabyCrudApiUrl:
    Description: "API Gateway endpoint URL for Baby CRUD operations"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: !Sub UpNest-BabyCrud-${Environment}-ApiUrl

